<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>נדב — מרכז תפעול</title>
<!-- PWA: הוספה למסך הבית כאפליקציה במסך מלא -->
<link rel="manifest" href="/nadav.webmanifest" />
<meta name="theme-color" content="#0b0f17" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="נדב" />
<link rel="apple-touch-icon" href="/nadav-apple-180.png" />
<link rel="icon" type="image/png" href="/nadav-icon-192.png" />
<style>
  :root{--bg:#0b0f17;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--muted:#94a3b8;--txt:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#141a26,#0b0f17);color:var(--txt);
    font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 40px}
  .stage{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px}
  .orb{width:170px;height:170px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 30%,var(--o2),var(--o1) 70%);
    box-shadow:0 0 60px 8px color-mix(in srgb,var(--o1) 55%,transparent),inset 0 0 40px color-mix(in srgb,var(--o2) 60%,transparent);
    animation:pulse var(--sp) ease-in-out infinite}
  .orb::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--o1) 40%,transparent);animation:ring var(--sp) ease-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
  .headline{margin-top:20px;font-size:22px;font-weight:800;text-align:center}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .mic{margin-top:18px;width:66px;height:66px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);color:var(--txt);font-size:27px;cursor:pointer;transition:transform .15s}
  .mic:hover{transform:scale(1.06)}
  .mic.on{background:#ef444422;border-color:#ef4444;color:#fca5a5;animation:mic 1s ease-in-out infinite}
  @keyframes mic{0%,100%{box-shadow:0 0 0 0 #ef444455}50%{box-shadow:0 0 0 14px #ef444400}}
  .heard{margin-top:6px;color:#cbd5e1;font-size:14px;font-style:italic;min-height:18px}
  .typebar{display:flex;gap:8px;width:100%;max-width:520px;margin-top:14px}
  .typebar input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit}
  .typebar input:focus{outline:none;border-color:#3b82f6}
  .typebar button{background:#2563eb;border:none;color:#fff;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
  .mute{position:fixed;top:14px;left:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px}
  .opencard{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:12px;
    background:linear-gradient(90deg,#2563eb,#0ea5e9);color:#fff;text-decoration:none;border-radius:14px;padding:12px 18px;
    box-shadow:0 10px 30px rgba(37,99,235,.5);font-size:15px;max-width:92vw;animation:drop .3s ease}
  .opencard b{font-weight:800}
  .opencard span{background:rgba(255,255,255,.22);border-radius:9px;padding:6px 12px;font-weight:700;white-space:nowrap}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
  .grid{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;margin-top:22px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card h3{margin:0 0 12px;font-size:15px;color:#cbd5e1}
  .step{display:flex;align-items:center;gap:10px;font-size:14px;margin:7px 0}
  .step .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex-shrink:0}
  .step a{color:#38bdf8;text-decoration:none}
  .wf{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .pill{padding:5px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.1)}
  .pill.cur{background:#f59e0b22;border-color:#f59e0b;color:#fbbf24}
  .pill.ok{background:#10b98122;border-color:#10b981;color:#34d399}
  .pill.no{opacity:.45;text-decoration:line-through}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .feed{display:flex;flex-direction:column;max-height:300px;overflow:auto}
  .feed .row{display:flex;gap:9px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px}
  .feed .t{color:#64748b;font-size:11px;white-space:nowrap;margin-inline-start:auto}
  .rel{background:#f59e0b14;border:1px solid #f59e0b55;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
  .muted{color:var(--muted)}
  .term{margin-top:14px;background:#05070c;border:1px solid var(--line);border-radius:12px;height:200px;overflow:auto;
    padding:12px 14px;font-family:'JetBrains Mono',ui-monospace,'Courier New',monospace;font-size:12.5px;line-height:1.7;direction:ltr;text-align:left}
  .term .l{white-space:pre-wrap;word-break:break-word}
  .term .in{color:#7dd3fc}.term .out{color:#86efac}.term .sys{color:#64748b}.term .err{color:#fca5a5}
  .termhead{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <button class="mute" id="mute">🔊 קול פעיל</button>
  <a class="opencard" id="opencard" href="#" target="_blank" rel="noopener">🔗 <b id="openlabel"></b><span>פתח ↗</span></a>
  <div class="wrap">
    <div class="stage">
      <div class="orb" id="orb" style="--o1:#3b82f6;--o2:#22d3ee;--sp:6s"></div>
      <div class="headline" id="headline">מתחבר…</div>
      <div class="sub">נדב — מרכז תפעול חי · דרסו</div>
      <button class="mic" id="mic" title="דבר עם נדב">🎤</button>
      <div class="heard" id="heard"></div>
      <div class="typebar">
        <input id="cmd" placeholder='כתוב לנדב… ("משלוח קיה | מגרש אשדוד | מוסך ראשלצ" · "אשר" · "שליחים")' />
        <button id="sendbtn">שלח</button>
      </div>
    </div>
    <div class="grid">
      <div class="card"><h3>🚚 משלוח פעיל</h3><div id="dispatch"></div></div>
      <div class="card"><h3>⚡ פעילות חיה</h3><div class="feed" id="feed"></div></div>
    </div>
    <div class="termhead"><span>▸ נדב — פלט חי (טרמינל)</span><span id="dot">● מתחבר</span></div>
    <div class="term" id="term"></div>
  </div>

<script>
const SB='https://jfvkwfvuvvcpeawxgiaq.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impmdmt3ZnZ1dnZjcGVhd3hnaWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTc4OTEsImV4cCI6MjEwMTE5Mzg5MX0.dBGFYx3LlSVOjUfEjBDERyAcZDVUeRpc5Dj0kAHVnVI';
const KEY='nadav-derso-live-8x2k9qz7';
const PH={idle:['#3b82f6','#22d3ee','6s','נדב מוכן'],draft:['#8b5cf6','#3b82f6','3s','ממתין לאישור…'],dispatching:['#f59e0b','#ef4444','1.4s','משגר שליחים…'],accepted:['#10b981','#22d3ee','4s','שליח שובץ! 🎉'],failed:['#ef4444','#f59e0b','2s','אף שליח לא אישר']};
let muted=false,lastTs=0,connected=false,lastOpenTs=0,firstRender=true;
const $=id=>document.getElementById(id);

$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 קול כבוי':'🔊 קול פעיל';};
// Hebrew TTS — getVoices() is async and empty on first call, so cache and re-scan
// on voiceschanged; otherwise the browser reads Hebrew text with an English voice.
let HE_VOICE=null;
function pickHeVoice(){try{const vs=speechSynthesis.getVoices()||[];HE_VOICE=vs.find(x=>/he[-_]?il/i.test(x.lang))||vs.find(x=>/^(he|iw)\b/i.test(x.lang))||vs.find(x=>/hebrew|עברית/i.test(x.name))||null;}catch(e){}}
if(window.speechSynthesis){pickHeVoice();speechSynthesis.onvoiceschanged=pickHeVoice;}
function speak(t){if(muted||!window.speechSynthesis||!t)return;try{if(!HE_VOICE)pickHeVoice();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=1.02;if(HE_VOICE)u.voice=HE_VOICE;speechSynthesis.speak(u);}catch(e){}}
function term(cls,txt){const el=$('term');const d=document.createElement('div');d.className='l '+cls;const ts=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});d.textContent='['+ts+'] '+txt;el.appendChild(d);el.scrollTop=el.scrollHeight;while(el.children.length>200)el.removeChild(el.firstChild);}

// Direct Supabase REST — no external library (avoids CDN/CSP failure that left it "מתחבר").
async function rpc(fn,args){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok)throw new Error(fn+' '+r.status);
  return r.json();
}

function render(s){
  const p=PH[s.phase]||PH.idle;
  $('orb').style.cssText='--o1:'+p[0]+';--o2:'+p[1]+';--sp:'+p[2];
  $('headline').textContent=s.headline||p[3];
  const d=s.dispatch,cs=s.couriers||[];
  if(!d){$('dispatch').innerHTML='<div class="muted" style="font-size:14px">אין משלוח פעיל.<br>אמור/כתוב: "משלוח &lt;רכב&gt; | &lt;מגרש&gt; | &lt;יעד&gt;"</div>';}
  else{
    const r=d.route||{};
    const gas=r.gasStop?('⛽ תדלוק: '+r.gasStop.name+' <a href="'+r.gasStop.wazeUrl+'" target="_blank">Waze</a>'):'⛽ תדלוק בדרך';
    const wash=r.washStop?('🧼 שטיפה: '+r.washStop.name+' <a href="'+r.washStop.wazeUrl+'" target="_blank">Waze</a>'):'🧼 שטיפה בדרך';
    const badge=d.status==='accepted'?'<span class="badge" style="background:#10b98122;color:#34d399">✅ שובץ: '+(d.acceptedBy&&d.acceptedBy.name||'')+'</span>':d.status==='failed'?'<span class="badge" style="background:#ef444422;color:#f87171">⚠️ אף שליח לא אישר</span>':'<span class="badge" style="background:#f59e0b22;color:#fbbf24">📤 משגר… ('+((d.idx||0)+1)+'/'+d.total+')</span>';
    const pills=cs.map((c,i)=>'<span class="pill '+(d.status==='accepted'&&d.acceptedBy&&d.acceptedBy.name===c.name?'ok':d.status==='dispatching'&&i===d.idx?'cur':i<(d.idx||0)?'no':'')+'">'+c.name+'</span>').join('');
    $('dispatch').innerHTML='<div style="font-size:18px;font-weight:800;margin-bottom:8px">'+d.car+'</div>'+
      '<div class="step"><span class="ic">📍</span> איסוף: '+d.from+'</div>'+
      '<div class="step"><span class="ic">⛽</span> '+gas+'</div>'+
      '<div class="step"><span class="ic">🧼</span> '+wash+'</div>'+
      '<div class="step"><span class="ic">🏁</span> מסירה: '+d.to+'</div>'+
      (r.routeUrl?'<div class="step"><span class="ic">🗺️</span> <a href="'+r.routeUrl+'" target="_blank">מסלול מלא</a></div>':'')+
      (d.notes?'<div class="muted" style="font-size:13px;margin-top:6px">📝 '+d.notes+'</div>':'')+
      '<div style="margin-top:12px">'+badge+'</div>'+(pills?'<div class="wf">'+pills+'</div>':'');
  }
  const ev=s.events||[];
  $('feed').innerHTML=(s.releases||[]).map(x=>'<div class="rel">📩 אישור שחרור: '+x.car+(x.yard?' ב'+x.yard:'')+'</div>').join('')+
    (ev.length?ev.map(e=>'<div class="row"><span>'+(e.icon||'•')+'</span><span>'+e.text+'</span><span class="t">'+(e.ts?new Date(e.ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'')+'</span></div>').join(''):'<div class="muted" style="padding:6px;font-size:13px">אין אירועים עדיין…</div>');
  const fresh=ev.filter(e=>e.ts&&e.ts>lastTs).sort((a,b)=>a.ts-b.ts);
  for(const e of fresh)term('out',(e.icon||'•')+' '+e.text);
  if(fresh.length){lastTs=fresh[fresh.length-1].ts;speak(fresh[fresh.length-1].text);}
  // "נדב פותח" — כשנדב פותר יעד ללינק, פותחים אותו בדפדפן ומציגים קישור לחיץ.
  const op=s.open;
  if(op&&op.ts&&op.ts>lastOpenTs){
    lastOpenTs=op.ts;
    if(!firstRender){                              // אל תפתח יעד ישן בטעינה ראשונה
      const link='<a href="'+op.url+'" target="_blank" rel="noopener">'+(op.label||op.url)+' ↗</a>';
      const el=document.createElement('div');el.className='l out';
      el.innerHTML='['+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'] 🔗 פותח: '+link+' — <span class="sys" style="direction:rtl">'+op.url+'</span>';
      $('term').appendChild(el);$('term').scrollTop=$('term').scrollHeight;
      // באנר גדול לנגיעה אחת — פתיחה מובטחת גם כשהדפדפן חוסם פופאפ אוטומטי.
      const card=$('opencard');$('openlabel').textContent=op.label||op.url;card.href=op.url;card.style.display='flex';
      clearTimeout(window._openHide);window._openHide=setTimeout(()=>{card.style.display='none';},20000);
      try{const w=window.open(op.url,'_blank');if(w)card.style.display='none';}catch(e){} // אם הפופאפ עבר — מסתירים את הבאנר
      speak((op.label||'')+' — לחץ לפתיחה');
    }
  }
  firstRender=false;
}

async function poll(){
  try{
    const data=await rpc('nadav_public_state',{p_key:KEY});
    if(!connected){connected=true;$('dot').textContent='● מחובר';$('dot').style.color='#34d399';term('sys','מחובר לנדב ✓');}
    if(data&&!data.error)render(data);
  }catch(e){if(connected){connected=false;}$('dot').textContent='● מנותק';$('dot').style.color='#fca5a5';}
}
poll();setInterval(poll,3000);

async function send(t){
  t=(t||'').trim();if(!t)return;
  term('in','> '+t);
  try{const r=await rpc('nadav_public_command',{p_key:KEY,p_text:t});if(!r||!r.ok)term('err','לא נשלח: '+((r&&r.error)||'שגיאה'));}
  catch(e){term('err','שגיאת שליחה');}
}

$('opencard').addEventListener('click',()=>{setTimeout(()=>{$('opencard').style.display='none';},50);});
$('sendbtn').onclick=()=>{const v=$('cmd').value;$('cmd').value='';send(v);};
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('sendbtn').click();}});

let rec=null,listening=false;
$('mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('הדפדפן לא תומך בזיהוי דיבור — נסה Chrome (או כתוב בתיבה)');return;}
  if(listening){try{rec.stop();}catch(e){}return;}
  rec=new SR();rec.lang='he-IL';rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;
  rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$('heard').textContent='“'+t+'”';if(e.results[e.results.length-1].isFinal)send(t);};
  rec.onerror=()=>setL(false);rec.onend=()=>setL(false);
  try{speechSynthesis.cancel();}catch(e){}
  $('heard').textContent='';setL(true);try{rec.start();}catch(e){setL(false);}
};
function setL(v){listening=v;$('mic').className='mic'+(v?' on':'');$('mic').textContent=v?'🎙️':'🎤';}

term('sys','נדב מאתחל…');
</script>
</body>
</html>
